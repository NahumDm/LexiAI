services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexiai_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 15432 -> container 5432. On Windows, Hyper-V/WSL2 reserves
      # the 4938-5740 TCP range, so binding host 5432/5433 fails.
      # Other services still connect to `db:5432` over the docker network.
      - '${POSTGRES_HOST_PORT:-15432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lexiai_db}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  web:
    build:
      context: ..
      dockerfile: lexiai_backend/Dockerfile
    working_dir: /app/lexiai_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn lexiai_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexiai_backend.settings.dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lexiai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    ports:
      # Host port → container 8000. Windows often blocks 0.0.0.0:8000 (Hyper-V
      # excluded ranges). Override with WEB_HOST_PORT in .env (e.g. 8000 on macOS).
      - '${WEB_HOST_PORT:-18000}:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: lexiai_backend/Dockerfile
    working_dir: /app/lexiai_backend
    command: celery -A lexiai_backend worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexiai_backend.settings.dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lexiai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Prefork + PyTorch: avoid inherited OpenMP/BLAS thread pools deadlocking in encode()
      CELERY_WORKER_SKIP_EMBEDDING_WARMUP: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build:
      context: ..
      dockerfile: lexiai_backend/Dockerfile
    working_dir: /app/lexiai_backend
    command: celery -A lexiai_backend.celery beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexiai_backend.settings.dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lexiai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
