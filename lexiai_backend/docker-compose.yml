services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexiai_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  web:
    build:
      context: ..
      dockerfile: lexiai_backend/Dockerfile
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn lexiai_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexiai_backend.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lexiai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ..
      dockerfile: lexiai_backend/Dockerfile
    command: celery -A lexiai_backend worker -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexiai_backend.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lexiai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ..
      dockerfile: lexiai_backend/Dockerfile
    command: celery -A lexiai_backend beat -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: lexiai_backend.settings.prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lexiai_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
