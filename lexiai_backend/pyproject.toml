[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = 'black'
line_length = 88
known_django = ['django']

[tool.ruff]
line-length = 88
target-version = 'py312'
select = ['E', 'F', 'W', 'I', 'B', 'C4', 'UP']
ignore = ['E501']

[tool.ruff.per-file-ignores]
'*/migrations/*.py' = ['E501']
